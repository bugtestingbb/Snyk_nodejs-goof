name: SBOM

on:
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
    
jobs:
  SBOM:
    name: Enumerate SBOM (Software Bill of Materials (SBOM))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: SBOM Scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk sbom --format=cyclonedx1.4+json --all-projects --json-file-output=sbom.json
        
          echo "SBOM generated successfully!"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom.json
